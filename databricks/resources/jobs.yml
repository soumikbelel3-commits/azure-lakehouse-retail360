resources:
  jobs:
    # ----------------------------------------------------------------------------------
    # Daily batch: ERP files -> Bronze -> data quality gate -> Silver (DLT) -> Gold
    # ----------------------------------------------------------------------------------
    retail360_daily:
      name: retail360-daily-${bundle.target}
      max_concurrent_runs: 1
      timeout_seconds: 7200

      schedule:
        quartz_cron_expression: "0 30 2 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED # dev mode pauses schedules automatically

      email_notifications:
        on_failure:
          - ${var.alert_email}

      job_clusters:
        - job_cluster_key: etl
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            data_security_mode: SINGLE_USER # required for Unity Catalog
            autoscale:
              min_workers: 1
              max_workers: 4
            azure_attributes:
              availability: SPOT_WITH_FALLBACK_AZURE
              first_on_demand: 1
            spark_conf:
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"

      tasks:
        - task_key: bronze_ingest
          job_cluster_key: etl
          python_wheel_task:
            package_name: retail360
            entry_point: retail360-bronze
            parameters:
              - --catalog=${var.catalog}
              - --landing-root=${var.landing_root}
              - --checkpoint-root=${var.checkpoint_root}
              - --batch-id={{job.run_id}}
          libraries:
            - whl: ../../dist/*.whl

        - task_key: dq_gate
          depends_on:
            - task_key: bronze_ingest
          job_cluster_key: etl
          python_wheel_task:
            package_name: retail360
            entry_point: retail360-dq
            parameters:
              - --catalog=${var.catalog}
              - --min-pass-rate=0.90
          libraries:
            - whl: ../../dist/*.whl

        - task_key: silver_dlt
          depends_on:
            - task_key: dq_gate
          pipeline_task:
            pipeline_id: ${resources.pipelines.retail360_silver.id}
            full_refresh: false

        - task_key: gold_build
          depends_on:
            - task_key: silver_dlt
          job_cluster_key: etl
          python_wheel_task:
            package_name: retail360
            entry_point: retail360-gold
            parameters:
              - --catalog=${var.catalog}
          libraries:
            - whl: ../../dist/*.whl

    # ----------------------------------------------------------------------------------
    # Streaming: POS events from Event Hubs (Kafka endpoint) -> Bronze, always on in prod
    # ----------------------------------------------------------------------------------
    retail360_pos_stream:
      name: retail360-pos-stream-${bundle.target}
      max_concurrent_runs: 1
      continuous:
        pause_status: UNPAUSED # dev mode pauses schedules automatically
      email_notifications:
        on_failure:
          - ${var.alert_email}
      job_clusters:
        - job_cluster_key: stream
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            data_security_mode: SINGLE_USER
            num_workers: 1
      tasks:
        - task_key: pos_to_bronze
          job_cluster_key: stream
          python_wheel_task:
            package_name: retail360
            entry_point: retail360-bronze
            parameters:
              - --catalog=${var.catalog}
              - --landing-root=${var.landing_root}
              - --checkpoint-root=${var.checkpoint_root}
              - --entities
              - pos_events
              - --pos-source=eventhubs
              - --eventhubs-namespace=${var.eventhubs_namespace}
              - --continuous
          libraries:
            - whl: ../../dist/*.whl
