name: Deploy Data Factory

on:
  push:
    branches: [main]
    paths: ["adf/**", "scripts/deploy_adf.sh"]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install Data Factory CLI extension
        run: az extension add --name datafactory --only-show-errors
      - name: Deploy
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          FACTORY: ${{ vars.DATA_FACTORY_NAME }}
          STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          ERP_SQL_HOST: ${{ vars.ERP_SQL_HOST }}
        run: scripts/deploy_adf.sh
